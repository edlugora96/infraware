name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string

run-name: Release v${{ inputs.version }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize and validate release version
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Synchronization or validation failed at line $LINENO. No repository mutation occurred." >&2' ERR
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          VERSION="$VERSION" node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const cargoPath = 'Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          const updatedCargo = cargo.replace(/^(version\s*=\s*")[^"]+("\s*$)/m, `$1${version}$2`);
          if (updatedCargo === cargo) throw new Error('Root Cargo.toml version field not found');
          fs.writeFileSync(cargoPath, updatedCargo);
          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          cargo_version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          package_version=$(node -p "require('./package.json').version")
          [[ "$cargo_version" == "$VERSION" ]] || { echo "Cargo.toml version mismatch: $cargo_version"; exit 1; }
          [[ "$package_version" == "$VERSION" ]] || { echo "package.json version mismatch: $package_version"; exit 1; }
          cargo generate-lockfile
          cargo metadata --locked --format-version 1 >/dev/null
          cargo_lock_version=$(cargo metadata --locked --format-version 1 | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).packages.find(p=>p.name==="infraware"); if (!p) process.exit(1); process.stdout.write(p.version)})')
          [[ "$cargo_lock_version" == "$VERSION" ]] || { echo "Cargo.lock version mismatch: $cargo_lock_version"; exit 1; }
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists locally or remotely"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Remote tag $TAG already exists"; exit 1
          else
            remote_status=$?
            [[ "$remote_status" -eq 2 ]] || { echo "Unable to verify remote tag state"; exit "$remote_status"; }
          fi
          for target in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            if [[ "$target" == win32-x64 ]]; then file_path="binaries/$target/infraware.exe"; else file_path="binaries/$target/infraware"; fi
            test -s "$file_path" || { echo "Missing or empty $file_path"; exit 1; }
            if [[ "$target" == win32-x64 ]]; then
              [[ "$(head -c 2 "$file_path" | od -An -tx1)" =~ 4d[[:space:]]+5a ]] || { echo "Invalid PE format: $file_path"; exit 1; }
            else
              file "$file_path" | grep -Eiq 'ELF|Mach-O|executable' || { echo "Invalid platform format: $file_path"; exit 1; }
              test -x "$file_path" || { echo "Not executable: $file_path"; exit 1; }
            fi
          done
          node -e "const p=require('./package.json'); if (p.scripts?.postinstall || p.scripts?.preinstall) throw new Error('install hooks are forbidden'); if (JSON.stringify(p).match(/(download|install).*(binary|artifact)/i)) throw new Error('runtime download behavior is forbidden')"
          pack=$(npm pack --dry-run --json)
          echo "$pack"
          for path in bin/infraware.js binaries/darwin-arm64/infraware binaries/darwin-x64/infraware binaries/linux-x64/infraware binaries/win32-x64/infraware.exe; do
            echo "$pack" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=process.argv[1]; const j=JSON.parse(s); if(!j[0].files.some(f=>f.path===p)) process.exit(1)})' "$path" || { echo "Missing from npm pack: $path"; exit 1; }
          done

  build:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin-arm64
            os: macos-latest
            rust_target: aarch64-apple-darwin
          - target: darwin-x64
            os: macos-latest
            rust_target: x86_64-apple-darwin
          - target: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - target: win32-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build target binary
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --release --target "${{ matrix.rust_target }}"
          mkdir -p "binaries/${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == win32-x64 ]]; then
            cp "target/${{ matrix.rust_target }}/release/infraware.exe" "binaries/${{ matrix.target }}/infraware.exe"
          else
            cp "target/${{ matrix.rust_target }}/release/infraware" "binaries/${{ matrix.target }}/infraware"
            chmod +x "binaries/${{ matrix.target }}/infraware"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/${{ matrix.target }}/
          if-no-files-found: error

  stage:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true
      - name: Build and verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Staging failed at line $LINENO. Do not retry with an existing tag; inspect and rerun after cleanup." >&2' ERR
          mkdir -p dist
          cp binaries/darwin-arm64/infraware dist/infraware-darwin-arm64
          cp binaries/darwin-x64/infraware dist/infraware-darwin-x64
          cp binaries/linux-x64/infraware dist/infraware-linux-x64
          cp binaries/win32-x64/infraware.exe dist/infraware-win32-x64.exe
          (cd dist && sha256sum infraware-darwin-arm64 infraware-darwin-x64 infraware-linux-x64 infraware-win32-x64.exe | sort > checksums.txt && sha256sum -c checksums.txt)
          test "$(wc -l < dist/checksums.txt)" -eq 4
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [validate, build, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.version }}
          path: dist
      - name: Recheck and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'echo "Publication failed. Tag may not have been created. Inspect GitHub before retrying; remove a partial tag/release explicitly, then rerun. Never reuse an existing tag silently." >&2' ERR
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG" || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to publish: $TAG already exists. Clean up deliberately before retrying."; exit 1
          fi
          (cd dist && sha256sum -c checksums.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml package.json Cargo.lock binaries/
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): bundle binaries $TAG [skip ci]"
            git push origin HEAD:main
          fi
          git fetch origin main --tags
          git checkout --detach origin/main
          if git show-ref --verify --quiet "refs/tags/$TAG" || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to publish: $TAG already exists. Clean up deliberately before retrying."; exit 1
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$TAG" \
            -f "target_commitish=$(git rev-parse HEAD)" \
            -f "name=$TAG" \
            -F "generate_release_notes=true" \
            -F "draft=false" \
            -F "prerelease=false" \
            > release.json
          release_id=$(jq -er '.id' release.json)
          upload_url=$(jq -er '.upload_url' release.json | sed 's/{?name,label}$//')
          for asset in dist/infraware-darwin-arm64 dist/infraware-darwin-x64 dist/infraware-linux-x64 dist/infraware-win32-x64.exe dist/checksums.txt; do
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              "$upload_url?name=$(basename "$asset")" \
              --input "$asset" \
              >/dev/null
          done
          test -n "$release_id"
