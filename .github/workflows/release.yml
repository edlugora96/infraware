name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  TAG: v${{ inputs.version }}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate version, tag state, package, and binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Validation failed at line $LINENO. No repository mutation occurred." >&2' ERR
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          cargo_version=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -1)
          package_version=$(node -p "require('./package.json').version")
          [[ "$cargo_version" == "$VERSION" ]] || { echo "Cargo.toml version mismatch: $cargo_version"; exit 1; }
          [[ "$package_version" == "$VERSION" ]] || { echo "package.json version mismatch: $package_version"; exit 1; }
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "Tag $TAG already exists locally or remotely"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Remote tag $TAG already exists"; exit 1
          else
            remote_status=$?
            [[ "$remote_status" -eq 2 ]] || { echo "Unable to verify remote tag state"; exit "$remote_status"; }
          fi
          for target in darwin-arm64 darwin-x64 linux-x64 win32-x64; do
            if [[ "$target" == win32-x64 ]]; then file_path="binaries/$target/infraware.exe"; else file_path="binaries/$target/infraware"; fi
            test -s "$file_path" || { echo "Missing or empty $file_path"; exit 1; }
            if [[ "$target" == win32-x64 ]]; then
              [[ "$(head -c 2 "$file_path" | od -An -tx1)" =~ 4d[[:space:]]+5a ]] || { echo "Invalid PE format: $file_path"; exit 1; }
            else
              file "$file_path" | grep -Eiq 'ELF|Mach-O|executable' || { echo "Invalid platform format: $file_path"; exit 1; }
              test -x "$file_path" || { echo "Not executable: $file_path"; exit 1; }
            fi
          done
          node -e "const p=require('./package.json'); if (p.scripts?.postinstall || p.scripts?.preinstall) throw new Error('install hooks are forbidden'); if (JSON.stringify(p).match(/(download|install).*(binary|artifact)/i)) throw new Error('runtime download behavior is forbidden')"
          pack=$(npm pack --dry-run --json)
          echo "$pack"
          for path in bin/infraware.js binaries/darwin-arm64/infraware binaries/darwin-x64/infraware binaries/linux-x64/infraware binaries/win32-x64/infraware.exe; do
            echo "$pack" | node -e 'let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{const p=process.argv[1]; const j=JSON.parse(s); if(!j[0].files.some(f=>f.path===p)) process.exit(1)})' "$path" || { echo "Missing from npm pack: $path"; exit 1; }
          done

  stage:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and verify release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "Staging failed at line $LINENO. Do not retry with an existing tag; inspect and rerun after cleanup." >&2' ERR
          mkdir -p dist
          cp binaries/darwin-arm64/infraware dist/infraware-darwin-arm64
          cp binaries/darwin-x64/infraware dist/infraware-darwin-x64
          cp binaries/linux-x64/infraware dist/infraware-linux-x64
          cp binaries/win32-x64/infraware.exe dist/infraware-win32-x64.exe
          (cd dist && sha256sum infraware-darwin-arm64 infraware-darwin-x64 infraware-linux-x64 infraware-win32-x64.exe | sort > checksums.txt && sha256sum -c checksums.txt)
          test "$(wc -l < dist/checksums.txt)" -eq 4
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [validate, stage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-${{ inputs.version }}
          path: dist
      - name: Recheck and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          trap 'echo "Publication failed. Tag may not have been created. Inspect GitHub before retrying; remove a partial tag/release explicitly, then rerun. Never reuse an existing tag silently." >&2' ERR
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG" || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Refusing to publish: $TAG already exists. Clean up deliberately before retrying."; exit 1
          fi
          sha256sum -c <(cd dist && sha256sum * | sort)
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes dist/infraware-darwin-arm64 dist/infraware-darwin-x64 dist/infraware-linux-x64 dist/infraware-win32-x64.exe dist/checksums.txt
