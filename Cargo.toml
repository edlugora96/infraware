[package]
name = "infraware"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Passive, report-only CLI for deterministic offline repository and architecture analysis plus CLI-mediated definition management (foundation package)."
license = "MIT OR Apache-2.0"

# One package only. No [workspace] declared. No external runtime dependencies:
# this change delivers the CLI foundation with the standard library only.

# One package only. No [workspace] declared. The serde family backs the
# JSON-primary / YAML-output-only projections; the canonical document parser
# and ID validation remain standard-library only.

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10.9"
rusqlite = { version = "=0.38.0", features = ["bundled"] }
sqlite-vec = "=0.1.9"
ureq = "=2.12.1"
candle-core = "=0.9.1"
candle-nn = "=0.9.1"
candle-transformers = "=0.9.1"
tokenizers = "=0.22.0"

[dev-dependencies]

[[bin]]
name = "infraware"
path = "src/main.rs"

[lib]
name = "infraware"
path = "src/lib.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
uninlined_format_args = "warn"
semicolon_if_nothing_returned = "warn"
implicit_clone = "warn"
dbg_macro = "warn"
print_stdout = "warn"
